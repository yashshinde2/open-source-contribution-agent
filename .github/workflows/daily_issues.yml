name: Daily Custom Issue Digest

on:
  schedule:
    - cron: '0 6 * * *' # Every day at 06:00 UTC
  workflow_dispatch:

jobs:
  run-issue-pilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run IssuePilot Engine
        env:
          GITHUB_TOKEN: ${{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}}
          TELEGRAM_BOT_TOKEN: ${{8953328389:AAG4Wl9521UrqSZC50rz5jhithHWszGIBL8}}
          TELEGRAM_CHAT_ID: ${{5897660760}}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python main.py
